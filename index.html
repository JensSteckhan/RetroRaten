<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Raten</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a1a'/><text x='16' y='24' font-family='monospace' font-weight='900' font-size='17' text-anchor='middle' letter-spacing='-1'><tspan fill='%23ff2d78'>R</tspan><tspan fill='%23ffe600'>R</tspan></text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --neon-pink: #ff2d78;
    --neon-cyan: #00f5ff;
    --neon-yellow: #ffe600;
    --dark-bg: #0a0a1a;
    --card-bg: #12122a;
    --nav-h: 48px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--dark-bg);
    overflow: hidden;
  }

  /* ── Desktop (hover-capable): nav at top, hidden until hover ── */

  .frames {
    position: fixed;
    inset: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }

  iframe.active {
    display: block;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    background: rgba(18, 18, 42, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0, 245, 255, 0.15);
    display: flex;
    transform: translateY(-100%);
    transition: transform 0.2s ease;
    z-index: 100;
  }

  nav.visible {
    transform: translateY(0);
  }

  /* invisible strip at top that triggers the nav on desktop */
  #trigger {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 16px;
    z-index: 99;
  }

  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: rgba(255, 255, 255, 0.35);
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    transition: color 0.15s;
    letter-spacing: 0.04em;
    position: relative;
  }

  /* active indicator at bottom for top nav (desktop) */
  .tab::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 2px;
    background: transparent;
    transition: background 0.15s, box-shadow 0.15s;
  }

  .tab.active {
    color: var(--neon-cyan);
  }

  .tab.active::after {
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
  }

  .tab-icon {
    font-size: 15px;
    line-height: 1;
  }

  /* ── Mobile (touch / no hover): nav at bottom, always visible ── */
  @media (hover: none) {
    .frames {
      inset: 0 0 var(--nav-h) 0;
    }

    #trigger {
      display: none;
    }

    nav {
      top: auto;
      bottom: 0;
      border-bottom: none;
      border-top: 1px solid rgba(0, 245, 255, 0.15);
      transform: none;
      transition: none;
      /* always visible — override .visible logic */
      transform: translateY(0) !important;
    }

    /* active indicator at top for bottom nav (mobile) */
    .tab::after {
      bottom: auto;
      top: 0;
    }
  }
</style>
</head>
<body>

<div class="frames">
  <iframe id="frame-game" src="retroraten.html" class="active"></iframe>
  <iframe id="frame-impressum" src="impressum.html"></iframe>
</div>

<div id="trigger"></div>

<nav id="nav">
  <button class="tab active" id="tab-game" onclick="switchTab('game')">
    <span class="tab-icon">🕹️</span>
    RetroRaten
  </button>
  <button class="tab" id="tab-impressum" onclick="switchTab('impressum')">
    <span class="tab-icon">📄</span>
    Impressum
  </button>
</nav>

<script>
  const nav = document.getElementById('nav');
  const isMobile = window.matchMedia('(hover: none)').matches;

  let nearTop = false;
  let onNav = false;

  function update() {
    nav.classList.toggle('visible', nearTop || onNav);
  }

  if (!isMobile) {
    document.addEventListener('mousemove', (e) => {
      nearTop = e.clientY < 60;
      update();
    });

    nav.addEventListener('mouseenter', () => { onNav = true; update(); });
    nav.addEventListener('mouseleave', () => { onNav = false; update(); });
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('frame-' + name).classList.add('active');
    if (!isMobile) {
      nearTop = false;
      onNav = false;
      update();
    }
  }
</script>

</body>
</html>
